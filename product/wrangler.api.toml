#:schema node_modules/wrangler/config-schema.json
# Clarte API Worker — plan section 6.1, layer 3.
# Vapi tool webhook, Google OAuth, BYOK, Grok Imagine, graph and citation API.
# Free plan only: no R2, no Workers Paid, no custom domain until DNS is live.

name = "clarte-api"
main = "workers/api/index.ts"
compatibility_date = "2026-10-25"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.traces]
enabled = true

# Prompts live as markdown (plan section 9) and are bundled as text modules.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
# Non-secret configuration only. Secrets come from `wrangler secret put`
# and from `.dev.vars` locally — never from this file.
GEMMA_MODEL = "gemma-4-26b-a4b-it"
IMAGINE_ENABLED = "false"
APP_URL = "https://clarte.io"
API_URL = "https://api.clarte.io"
GOOGLE_REDIRECT_URI = "https://api.clarte.io/auth/callback/google"
ALLOWED_ORIGINS = "http://localhost:3000,https://clarte.io,https://www.clarte.io,https://clarte-web.pages.dev"

# The D1 database and Vectorize index were created before the product was renamed
# from PABER to Clarte. Their names are resource identities, not branding, so they
# stay as `paber` / `paber-docs`. Renaming them would mean recreating and reloading
# both stores for no user-visible gain. Bindings (DB, VECTORS, AI) are what the code
# actually uses.
[[d1_databases]]
binding = "DB"
database_name = "paber"
database_id = "38e1c167-dea2-44ab-9f18-0251c864357c"
migrations_dir = "db/migrations"

[[vectorize]]
binding = "VECTORS"
index_name = "paber-docs" # 768 dims, cosine

[ai]
binding = "AI"

# Custom domain for api.clarte.io, once clarte.io is served by Cloudflare DNS.
# Uncomment after the zone is active, then redeploy; the Worker keeps its
# workers.dev URL as well.
# [[routes]]
# pattern = "api.clarte.io"
# custom_domain = true
