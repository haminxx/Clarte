#:schema node_modules/wrangler/config-schema.json
# Clarte MCP server Worker — plan section 6.1, layer 4.
# search_tech, get_document, find_related, market_evidence, visualize_idea.
# Free plan only. Custom domain stays commented out until DNS is live.

name = "clarte-mcp"
main = "workers/mcp/index.ts"
compatibility_date = "2026-10-25"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.traces]
enabled = true

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
GEMMA_MODEL = "gemma-4-26b-a4b-it"
IMAGINE_ENABLED = "false"
# The API also allows https://<preview>.clarte-web.pages.dev in code. This Worker
# does not inspect Origin; the apex Pages host is listed so the var matches the API.
ALLOWED_ORIGINS = "http://localhost:3000,https://clarte.io,https://www.clarte.io,https://clarte-web.pages.dev"

[[durable_objects.bindings]]
name = "CLARTE_MCP"
class_name = "ClarteMcpAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClarteMcpAgent"]

# Legacy resource names, kept on purpose: the D1 database and Vectorize index were
# created as `paber` / `paber-docs` before the rename to Clarte. They are resource
# identities rather than branding, and renaming them would mean recreating and
# reloading both stores. The code only ever refers to the bindings.
[[d1_databases]]
binding = "DB"
database_name = "paber"
database_id = "38e1c167-dea2-44ab-9f18-0251c864357c"
migrations_dir = "db/migrations"

[[vectorize]]
binding = "VECTORS"
index_name = "paber-docs" # 768 dims, cosine

[ai]
binding = "AI"

# Custom domain for mcp.clarte.io, once clarte.io is served by Cloudflare DNS.
# Uncomment after the zone is active, then redeploy.
# [[routes]]
# pattern = "mcp.clarte.io"
# custom_domain = true
